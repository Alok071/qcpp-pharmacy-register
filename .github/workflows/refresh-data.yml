name: Refresh pharmacy data

on:
  schedule:
    - cron: "0 19 * * *" # ~5am AEST daily
  workflow_dispatch: {}

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch latest JASANZ data
        run: node fetch-data.js

      - name: Rebuild site artifact
        run: node build-artifact.js

      - name: Rebuild CSV export
        run: node build-csv.js

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pharmacies.json pharmacies.csv index.html
          if git diff --cached --quiet; then
            echo "No changes, skipping commit."
          else
            git commit -m "Refresh pharmacy data ($(date -u +%Y-%m-%d))"
            git push
          fi
